    <title>Hardware Khata POS</title>
    <!--
      NO WEBFONTS ON PURPOSE.

      This used to pull Inter + JetBrains Mono from fonts.googleapis.com. In a
      packaged offline-first shop app that is a liability, not a nicety:
        - on a counter PC with no internet it is a render-blocking request that
          waits on a DNS timeout before the UI paints, and
        - it was the app's ONLY outbound request, and it correlated with
          repeated "Network service crashed, restarting service" in the packaged
          build.
      The font stacks in tailwind.config.js / globals.css already fall back to
      fonts every Windows machine ships with — system-ui (Segoe UI) for text,
      Consolas for figures, and Nirmala UI for Bangla — so the app now renders
      identically with or without a network, and makes no outbound request at
      all. Inter is still first in the stack, so it is picked up automatically if
      the shop ever installs it locally.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
