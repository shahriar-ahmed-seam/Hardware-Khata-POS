<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hardware Khata POS</title>
    <!--
      NO WEBFONTS ON PURPOSE.

      This used to pull Inter + JetBrains Mono from fonts.googleapis.com. In a
      packaged offline-first shop app that is a liability, not a nicety:
        - on a counter PC with no internet it is a render-blocking request that
          waits on a DNS timeout before the UI paints, and
        - it was the app's ONLY outbound request, and it correlated with
          repeated "Network service crashed, restarting service" in the packaged
          build.
      The font stacks in tailwind.config.js / globals.css use fonts every
      Windows machine ships with — Segoe UI for text, Consolas for codes — plus
      Noto Sans Bengali for Bangla, which is BUNDLED with the app (imported in
      src/main.tsx, served from disk) because Windows 7 has no Nirmala UI. So
      the app renders identically with or without a network, and makes no
      outbound request at all. Inter is still first in the stack, so it is
      picked up automatically if the shop ever installs it locally.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
